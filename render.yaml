services:
  - type: web
    name: mahir-showroom-api
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install --upgrade 'pip>=26.2.2' && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      sh -c 'DATABASE_URL="${MIGRATION_DATABASE_URL:-$DATABASE_URL}" python manage.py migrate --noinput &&
      exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --worker-class gthread --workers 3 --threads 4 --timeout 60 --max-requests 1000 --max-requests-jitter 100'
    healthCheckPath: /api/health/
    disk:
      name: mahir-showroom-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

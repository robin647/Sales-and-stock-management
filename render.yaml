services:
  - type: web
    name: sales-and-stock-management
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MEDIA_ROOT
        value: /app/media
      - key: GUNICORN_WORKERS
        value: "1"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_BACKEND
        value: apps.accounts.email_backend.GmailApiEmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: Mahir Sherwani <mhrobin471@gmail.com>
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: OTP_DAILY_EMAIL_LIMIT
        value: "400"

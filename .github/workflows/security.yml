name: Security and regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: security_checks
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_test -d security_checks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test_postgres
      TEST_DATABASE_URL: postgres://security_test:isolated-ci-password@127.0.0.1:5432/security_checks
      SECRET_KEY: isolated-ci-only-key-never-used-for-a-real-deployment-4829730156
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test config core.test_security apps.accounts.test_email_auth apps.accounts.test_customers apps.accounts.tests apps.assistant.tests apps.ecommerce.tests apps.products.tests apps.products.test_codes apps.products.test_online_inventory apps.shop.tests apps.wholesale.tests apps.reports.tests apps.employees.tests apps.producers.tests apps.swing.tests --noinput

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build
        env:
          VITE_API_URL: https://sales-and-stock-management.onrender.com/api
